name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.41.0

      - name: Lint markdown
        run: markdownlint "**/*.md" --ignore node_modules --ignore LICENSE --ignore NOTICE

  validate-samples:
    name: Validate sample JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON parses
        run: |
          python -c "
          import json, sys, pathlib
          failed = False
          for p in pathlib.Path('samples').glob('*.json'):
              try:
                  json.loads(p.read_text())
                  print(f'ok  {p}')
              except json.JSONDecodeError as e:
                  print(f'FAIL {p}: {e}', file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          "

  build-and-test:
    name: Build and test .NET solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SpeakerPipeline.slnx

      - name: Build
        run: dotnet build SpeakerPipeline.slnx --configuration Release --no-restore

      - name: Start isolated storage emulator
        run: |
          npm install --global azurite@3.35.0
          # The SDK can ship a newer service-version header than this pinned emulator.
          # Exercise actual blob/table operations and ETags without its header-only gate.
          azurite --silent --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" > "$RUNNER_TEMP/azurite.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:10002/devstoreaccount1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: All unit tests and both agent eval suites (blocking)
        env:
          PIPELINE_AZURITE_MAINTENANCE_TEST: "1"
          PIPELINE_AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: dotnet test SpeakerPipeline.slnx --configuration Release --no-build --logger trx

      - name: Validate production infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/api.bicep --stdout > /dev/null
          az bicep build --file infra/data-tables.bicep --stdout > /dev/null

      - name: Package the tested commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dotnet publish src/SpeakerPipeline.Api --configuration Release --no-build --output publish/api
          dotnet publish src/SpeakerPipeline.Hosting.Functions --configuration Release --no-build --output publish/functions
          mkdir -p release
          (cd publish/api && zip -qr ../../release/api.zip .)
          (cd publish/functions && zip -qr ../../release/functions.zip .)
          cp infra/functions.settings.json release/functions.settings.json
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '{sha: $sha, ciRunId: $run}' > release/release.json
          (cd release && sha256sum api.zip functions.zip functions.settings.json release.json > SHA256SUMS)

      - name: Retain immutable deployment and rollback packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/TestResults/*.trx
            **/evals-report.json
