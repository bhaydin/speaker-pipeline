name: Release production

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run containing the release (or rollback) artifact
        required: true
        type: string
      commit_sha:
        description: Full 40-character SHA tested by that CI run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: speaker-pipeline-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      API_SCOPE: ${{ vars.API_SCOPE }}
    steps:
      - name: Verify successful main CI provenance and production configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for key in AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME AZURE_FUNCTIONAPP_NAME API_SCOPE; do
            test -n "${!key}" || { echo "::error::Missing production variable $key"; exit 1; }
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .status == "completed" and
            .head_sha == $sha and .head_branch == "main" and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/ci.yml" and
            (.event == "push" or .event == "workflow_dispatch")
          ' "$RUNNER_TEMP/ci-run.json" > /dev/null

      - name: Download tested packages (never rebuild in deployment)
        uses: actions/download-artifact@v4
        with:
          name: production-release-${{ inputs.commit_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Verify package checksums and manifest
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          jq -e --arg sha "$RELEASE_SHA" --arg run "$CI_RUN_ID" '.sha == $sha and .ciRunId == $run' release/release.json > /dev/null
          # Operational controls belong to the operator, never the package.
          jq -e '[keys[] | select(test("^(Maintenance__|Notifications__|Telegram__Enabled$|Storage__(OpportunitiesEnabled|OpportunitiesProvisioned|CatalogProvisioned|OperationsProvisioned)$|Pipeline__OpportunitiesEnabled$|ScoringAgent__CatalogEnabled$|Catalog__Enabled$|Dashboard__Enabled$|AzureWebJobs\\.)"))] | length == 0' release/functions.settings.json > /dev/null

      - name: Azure login (production OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record rollback reference and operational switches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-record
          # Settings identify an attempted release; this successful workflow is
          # the authoritative recovery reference after a partial deployment.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?status=success&branch=main&per_page=1" \
            --jq '[.workflow_runs[] | {id, html_url, conclusion}]' > release-record/last-successful-release.json
          az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" -o json > "$RUNNER_TEMP/api-settings.json"
          az functionapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" -o json > "$RUNNER_TEMP/functions-settings.json"
          for app in api functions; do
            jq '[.[] | select(.name | test("^(Maintenance__(Enabled|FreezeWrites)$|Notifications__(SuppressEmptyScheduledRuns|Email__Enabled)$|Telegram__Enabled$|Storage__(OpportunitiesEnabled|OpportunitiesProvisioned|CatalogProvisioned|OperationsProvisioned)$|Pipeline__OpportunitiesEnabled$|ScoringAgent__CatalogEnabled$|Catalog__Enabled$|Dashboard__Enabled$|AzureWebJobs\\..*\\.Disabled$)"))] | sort_by(.name)' "$RUNNER_TEMP/$app-settings.json" > "$RUNNER_TEMP/$app-controls.json"
            jq '[.[] | select(.name == "Release__CommitSha" or .name == "Release__CiRunId")]' "$RUNNER_TEMP/$app-settings.json" > "release-record/previous-$app.json"
          done
          cp release/release.json release-record/requested-release.json
          # Full appsettings may contain secrets; never print or upload them.
          rm "$RUNNER_TEMP/api-settings.json" "$RUNNER_TEMP/functions-settings.json"

      - name: Pin runtime mode and apply additive application configuration
        run: |
          set -euo pipefail
          # The package also contains the hosted Blazor client's runtimeconfig.
          # Always launch the API explicitly, including when replaying an artifact.
          az webapp config set -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --startup-file "dotnet /home/site/wwwroot/SpeakerPipeline.Api.dll" --output none
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --output none --settings ASPNETCORE_ENVIRONMENT=Production DOTNET_ENVIRONMENT=Production ASPNETCORE_FORWARDEDHEADERS_ENABLED=true Release__CommitSha="$RELEASE_SHA" Release__CiRunId="$CI_RUN_ID"
          az functionapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --output none --settings @release/functions.settings.json AZURE_FUNCTIONS_ENVIRONMENT=Production DOTNET_ENVIRONMENT=Production Release__CommitSha="$RELEASE_SHA" Release__CiRunId="$CI_RUN_ID"

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release/api.zip
          restart: false

      - name: Restart API before dependency checks
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # Start a clean process that loads the deployed assemblies before dependency checks.
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --only-show-errors --output none

      - name: Verify API health and authorization before deploying consumers
        run: |
          set -euo pipefail
          # A retiring worker can answer one probe before restart transitions finish.
          # Share bounded checks across both API and Functions verification steps.
          cat > "$RUNNER_TEMP/expect-http-status.sh" <<'BASH'
          expect_status() {
            local expected="$1" host="$2" path="$3" attempt code
            shift 3
            for attempt in $(seq 1 12); do
              if ! code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@" "https://$host$path"); then
                # Preserve unexpected auth statuses even if the body transfer fails.
                if [ "$code" = "$expected" ] || [ -z "$code" ]; then code=000; fi
              fi
              echo "HTTP check $path attempt $attempt: HTTP $code"
              if [ "$code" = "$expected" ]; then return 0; fi
              case "$code" in
                000|408|429|500|502|503|504)
                  if [ "$attempt" = 12 ]; then echo "::error::HTTP check $path exhausted retries: $code"; return 1; fi
                  ;;
                *) echo "::error::HTTP check $path returned unexpected status: $code"; return 1 ;;
              esac
              sleep 10
            done
          }
          BASH
          source "$RUNNER_TEMP/expect-http-status.sh"
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query 'defaultHostName || properties.defaultHostName' -o tsv)
          test -n "$host" || { echo '::error::API hostname was not returned by Azure'; exit 1; }
          expect_status 200 "$host" /health
          token=$(az account get-access-token --scope "$API_SCOPE" --query accessToken -o tsv)
          echo "::add-mask::$token"
          expect_status 200 "$host" /health/ready -H "Authorization: Bearer $token"
          paths=(/health/ready /v1/events /v1/talks /v1/events/readiness-probe/submissions /v1/topics /v1/blackouts /v1/operations/runs "/v1/notifications/$(date -u +%Y-%m)")
          for path in "${paths[@]}"; do
            expect_status 401 "$host" "$path"
            expect_status 401 "$host" "$path" -H 'Authorization: Bearer dev'
          done
          for path in "${paths[@]}"; do
            expect_status 200 "$host" "$path" -H "Authorization: Bearer $token"
          done
          # The release identity has ordinary access, never maintenance access.
          expect_status 403 "$host" /v1/admin/data/snapshot -H "Authorization: Bearer $token"

      - name: Deploy agents Functions host
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: release/functions.zip
          sku: flexconsumption

      - name: Verify functions indexed and preserve operational switches
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/expect-http-status.sh"
          expected='["ScoringAgentHttpTrigger","ScoringAgentTimerTrigger","TrackerMaintenanceHttpTrigger","TrackerMaintenanceTimerTrigger","DiscoveryHttpTrigger","DiscoveryTimerTrigger","TelegramWebhook","IngestHttpTrigger","ReadinessHttpTrigger","WeeklyHealthTimerTrigger","CatalogWebhook","CatalogSyncWorker","CatalogNightlySync","NotificationRetryTimerTrigger"]'
          for attempt in $(seq 1 18); do
            names=$(az functionapp function list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --query '[].name' -o json 2>/dev/null || echo '[]')
            if jq -e --argjson expected "$expected" 'map(split("/")[-1]) as $actual | ($expected - $actual | length) == 0' <<< "$names" > /dev/null; then break; fi
            if [ "$attempt" = 18 ]; then echo '::error::Expected functions did not index'; exit 1; fi
            sleep 15
          done
          functionsHost=$(az functionapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --query 'defaultHostName || properties.defaultHostName' -o tsv)
          test -n "$functionsHost" || { echo '::error::Functions hostname was not returned by Azure'; exit 1; }
          readinessKey=$(az functionapp keys list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --query functionKeys.default -o tsv)
          test -n "$readinessKey"
          echo "::add-mask::$readinessKey"
          expect_status 200 "$functionsHost" /api/readiness -H "x-functions-key: $readinessKey"
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query 'defaultHostName || properties.defaultHostName' -o tsv)
          test -n "$host" || { echo '::error::API hostname was not returned by Azure'; exit 1; }
          token=$(az account get-access-token --scope "$API_SCOPE" --query accessToken -o tsv)
          echo "::add-mask::$token"
          expect_status 200 "$host" /health/ready -H "Authorization: Bearer $token"
          az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" -o json > "$RUNNER_TEMP/api-settings.json"
          az functionapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" -o json > "$RUNNER_TEMP/functions-settings.json"
          for app in api functions; do
            jq '[.[] | select(.name | test("^(Maintenance__(Enabled|FreezeWrites)$|Notifications__(SuppressEmptyScheduledRuns|Email__Enabled)$|Telegram__Enabled$|Storage__(OpportunitiesEnabled|OpportunitiesProvisioned|CatalogProvisioned|OperationsProvisioned)$|Pipeline__OpportunitiesEnabled$|ScoringAgent__CatalogEnabled$|Catalog__Enabled$|Dashboard__Enabled$|AzureWebJobs\\..*\\.Disabled$)"))] | sort_by(.name)' "$RUNNER_TEMP/$app-settings.json" > "$RUNNER_TEMP/$app-controls-after.json"
            diff -u "$RUNNER_TEMP/$app-controls.json" "$RUNNER_TEMP/$app-controls-after.json"
          done
          rm "$RUNNER_TEMP/api-settings.json" "$RUNNER_TEMP/functions-settings.json"
          echo "Released tested commit $RELEASE_SHA from CI run $CI_RUN_ID. Operational switches were preserved." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release and rollback references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-record-${{ github.run_id }}
          path: release-record/
          if-no-files-found: warn
          retention-days: 90

      - name: Azure logout
        if: always()
        run: az logout
